name: Build AB Open World Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Fix Expo Dependencies
        run: npx expo install --fix

      - name: Generate Android Project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Native APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AB_Open_World_Native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AB-OPEN-WORLD-NATIVE-APK
          path: AB_Open_World_Native.apk
          if-no-files-found: error
          retention-days: 14
